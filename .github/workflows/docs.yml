# Builds the user documentation site (Epic #1182) and publishes it to GitHub
# Pages. Pull requests build only; pushes to main deploy via `mkdocs gh-deploy`
# to the gh-pages branch (#1837) — the same mechanism `make docs-deploy` uses
# locally. Pages' source must be set to "Deploy from a branch" (gh-pages,
# /root) for this to take effect; see the Makefile's docs-deploy target.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "userdocs/**"
      - "docs/screenshots/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "userdocs/**"
      - "docs/screenshots/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: userdocs/requirements.txt

      - name: Install MkDocs
        run: pip install -r userdocs/requirements.txt

      # --strict turns broken links and warnings into build failures.
      - name: Build site
        run: mkdocs build --strict

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: userdocs/requirements.txt

      - name: Install MkDocs
        run: pip install -r userdocs/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Builds and force-pushes site/ to gh-pages — the branch Pages is
      # configured to serve from. Same command as `make docs-deploy`.
      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --strict
