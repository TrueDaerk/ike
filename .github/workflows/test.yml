# The full test suite (#2997): `go vet ./...` and `go test ./...` on every PR
# and every push to main, with a hard 5-minute test timeout so a red suite or
# a package that has grown slow fails the PR instead of the next developer's
# afternoon. The budget: the whole run under 2 minutes on a ~10-core
# developer machine, no package over 60 s (CONTRIBUTING.md, "Building and
# testing"). The job runs on macOS: the suite is written against the macOS
# default keymap (cmd chords) and pty behaviour, and the first Linux run
# showed 71 platform-specific failures across ten packages — tracked
# separately as Linux test portability (#3000). macOS minutes are free for
# a public repository.
#
# The hosted macOS runner has three cores and is three to four times slower
# than a developer machine: with every package in flight at once, internal/app
# (3000 sequential tests, many of them spawning shells) was starved past the
# timeout while the wasm packages compiled, and pty-backed tests in other
# packages missed their spawn bounds. So the suite runs in three steps — the
# bulk of the packages two at a time, the wasm packages, then internal/app
# alone with the machine to itself — each under its own 5-minute bound.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (every package but wasm and internal/app)
        env:
          CGO_ENABLED: "1"
        run: go test $(go list ./... | grep -v '^ike/internal/app$' | grep -v '^ike/internal/wasm') -p 2 -timeout 5m

      - name: Test wasm
        env:
          CGO_ENABLED: "1"
        run: go test ./internal/wasm/... -timeout 5m

      - name: Test internal/app
        env:
          CGO_ENABLED: "1"
        run: go test ./internal/app -timeout 5m
