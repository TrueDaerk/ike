# The full test suite (#2997): `go vet ./...` and `go test ./...` on every PR
# and every push to main, with a hard 5-minute test timeout so a red suite or
# a package that has grown slow fails the PR instead of the next developer's
# afternoon. The budget: the whole run under 2 minutes on a ~10-core
# developer machine, no package over 60 s (CONTRIBUTING.md, "Building and
# testing"). The job runs on macOS and on Linux (#3000): the suite is written
# against the macOS default keymap and pins it (keymap.GOOS = "darwin" in the
# keymap, settings, tour and app test mains), and the pty tests drive bash
# where /bin/sh is dash, so both platforms run the same tests. macOS minutes
# are free for a public repository; the two jobs run independently
# (fail-fast off) so one platform's failure still shows the other's result.
#
# The hosted runners have three (macOS) or four (Linux) cores and are three
# to four times slower than a developer machine: with every package in flight
# at once, internal/app (3000 sequential tests, many of them spawning shells)
# was starved past the timeout while the wasm packages compiled, and
# pty-backed tests in other packages missed their spawn bounds. So the suite
# runs in three steps — the bulk of the packages two at a time, the wasm
# packages, then internal/app alone with the machine to itself — each under
# its own 5-minute bound.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (every package but wasm and internal/app)
        env:
          CGO_ENABLED: "1"
        run: go test $(go list ./... | grep -v '^ike/internal/app$' | grep -v '^ike/internal/wasm') -p 2 -timeout 5m

      - name: Test wasm
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"
        run: go test ./internal/wasm/... -timeout 5m

      - name: Test internal/app
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"
        run: go test ./internal/app -timeout 5m

  # The ConPTY session (#3005) is the one piece of the terminal the unix jobs
  # cannot exercise, so a Windows job runs the terminal package's ConPTY
  # tests (plus the pure helpers behind the Windows spawn) on windows-latest.
  # Only those: the rest of the package drives /bin/sh. CGO stays off — the
  # terminal package has no cgo dependency, and the MSYS2 toolchain the
  # release build needs would cost minutes here for nothing.
  windows:
    runs-on: windows-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet internal/terminal
        env:
          CGO_ENABLED: "0"
        run: go vet ./internal/terminal

      - name: Test ConPTY
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/terminal -run 'ConPTY|ShellOrder|ShellOverride|EnvironmentBlock' -v -timeout 5m
