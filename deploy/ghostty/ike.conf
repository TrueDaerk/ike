# IKE's dedicated Ghostty configuration (#1567).
#
# Loaded EXCLUSIVELY by the ike-gui launcher via
#   ghostty --config-default-files=false --config-file=<this file>
# so your normal Ghostty config never interferes with the IKE window and
# vice versa. Edit freely — reinstalling (`make install-desktop`) only
# overwrites it after a confirmation.

# ---- appearance / behavior (tune as desired) ----
# The installer replaces `command = ike` with the absolute path of the ike
# binary it found, because a Dock/desktop launch does not inherit your
# shell's PATH.
command = ike
window-save-state = never
quit-after-last-window-closed = true
# Linux only: Wayland app_id / X11 WM_CLASS, matched by ike.desktop's
# StartupWMClass so the dock shows the Ike icon at runtime. Ignored on macOS.
class = ike
# macOS-only keys are silently ignored on Linux, safe to keep:
macos-titlebar-style = hidden

# The runtime font zoom (super/ctrl + plus/minus below) is per-instance and
# NOT persisted — every launch starts from this file (#1584). To keep a size
# across launches, set it here (super+, opens this file, super+shift+,
# reloads it live):
# font-size = 13

# ---- keybindings ----
# Wipe ALL Ghostty defaults so chords reach IKE (see README "Platform
# notes"), then re-add only what the terminal itself must own. `super+` is
# Cmd on macOS; the `ctrl+` mirrors serve Linux, where `super+` bindings
# have no effect on typical setups.
keybind = clear

# Ghostty housekeeping:
keybind = super+,=open_config
keybind = super+shift+,=reload_config
keybind = ctrl+,=open_config
keybind = ctrl+shift+,=reload_config

# After `keybind = clear` the app would be unquittable the native way.
# (ctrl+q itself belongs to IKE — quick documentation — hence the shift.)
keybind = super+q=quit
keybind = ctrl+shift+q=quit

# Font size is terminal territory, IKE can't do it. The minus trigger is
# spelled `-` (Unicode codepoint, matched by whatever key produces "-" on
# the active layout): the name `minus` means the *physical* W3C Minus key,
# which is ß on German QWERTZ — the actual - key never matched (#1584).
# `plus`/`zero` are legacy aliases for the codepoints '+'/'0', already
# layout-aware. Note super+- consumes Cmd+- before IKE sees it; if you bind
# Cmd+-/Cmd++ IDE-side (e.g. folding), delete the super lines here.
keybind = super+plus=increase_font_size:1
keybind = super+-=decrease_font_size:1
keybind = super+zero=reset_font_size
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+-=decrease_font_size:1
keybind = ctrl+zero=reset_font_size

# macOS only: Option is a composition key (needed for { [ @ ~ on
# international layouts), so option+<character> arrives without the alt
# modifier. Backspace produces no composed character, so re-synthesize the
# escape sequence IKE/shells expect (must come *after* `keybind = clear`).
# Option+Arrows and Option+Forward-Delete need NO such lines: after the
# `clear` Ghostty encodes them with a real alt modifier, which is exactly
# what IKE's keymap matches — re-synthesizing them as text: broke word
# navigation/deletion (#1583).
keybind = alt+backspace=text:\x1b\x7f

# Deliberately NOT re-added: super+c / super+v — IKE handles the clipboard
# itself (OSC 52 / Kitty protocol). If paste into the terminal pane ever
# needs it, add `keybind = super+v=paste_from_clipboard` — but test IKE-side
# first; double-paste is worse than no bind.
